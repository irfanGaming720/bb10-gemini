<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gemini BB Q10</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, Helvetica, Arial, sans-serif; }
    body { background-color: #121212; color: #eee; height: 100vh; display: flex; flex-direction: column; padding: 6px; }
    #chatbox { flex: 1; overflow-y: scroll; border: 1px solid #333; background: #1c1c1c; padding: 8px; border-radius: 4px; font-size: 13px; line-height: 1.4; margin-bottom: 6px; }
    .msg { margin-bottom: 8px; word-wrap: break-word; }
    .user { color: #5dade2; }
    .bot { color: #58d68d; }
    .error { color: #ec7063; }
    .markdown h1, .markdown h2, .markdown h3 { color: #f4d03f; margin: 8px 0 4px; line-height: 1.2; }
    .markdown h1 { font-size: 18px; }
    .markdown h2 { font-size: 16px; }
    .markdown h3 { font-size: 14px; }
    .markdown ul { margin: 4px 0 4px 18px; padding: 0; }
    .markdown code { color: #f5b7b1; background: #252525; padding: 1px 3px; }
    .cursor { display: inline-block; margin-left: 2px; animation: blink 0.8s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .input-row { display: flex; height: 36px; gap: 4px; }
    #input-text { flex: 1; background: #2a2a2a; border: 1px solid #444; color: #fff; padding: 6px 8px; font-size: 13px; border-radius: 4px; }
    #btn-send { width: 60px; background: #2980b9; color: #fff; border: none; border-radius: 4px; font-weight: bold; font-size: 13px; cursor: pointer; }
    #btn-send:disabled { background: #555; }
  </style>
</head>
<body>

  <div id="chatbox">
    <div class="msg bot"><b>Gemini:</b> Siap digunakan di BB Q10!</div>
  </div>

  <div class="input-row">
    <input type="text" id="input-text" placeholder="Ketik pesan..." autocomplete="off">
    <button id="btn-send" onclick="sendMsg()">Kirim</button>
  </div>

  <script>
    function sendMsg() {
      var input = document.getElementById('input-text');
      var btn = document.getElementById('btn-send');
      var box = document.getElementById('chatbox');
      var text = input.value.trim();

      if (!text) return;

      // Render pesan user dan tempat balasan yang akan diisi bertahap.
      var userMessage = document.createElement('div');
      userMessage.className = 'msg user';
      userMessage.innerHTML = '<b>Kamu:</b> ' + escapeHtml(text);
      box.appendChild(userMessage);

      var botMessage = document.createElement('div');
      botMessage.className = 'msg bot markdown';
      botMessage.innerHTML = '<b>Gemini:</b> sedang menulis<span class="cursor">&#9612;</span>';
      box.appendChild(botMessage);
      input.value = '';
      btn.disabled = true;
      btn.innerText = '...';
      box.scrollTop = box.scrollHeight;

      // AJAX jadul via XMLHttpRequest
      var xhr = new XMLHttpRequest();
      var receivedLength = 0;
      var sseBuffer = '';
      var replyText = '';
      var shownText = '';
      var streamFinished = false;
      var typingTimer = null;
      xhr.open('POST', '/api/chat?stream=1', true);
      xhr.setRequestHeader('Content-Type', 'application/json');

      xhr.onreadystatechange = function() {
        if (xhr.readyState === 3 && xhr.status === 200) {
          readStream(xhr.responseText.substring(receivedLength));
          receivedLength = xhr.responseText.length;
        }

        if (xhr.readyState === 4) {
          btn.disabled = false;
          btn.innerText = 'Kirim';

          if (xhr.status === 200) {
            readStream(xhr.responseText.substring(receivedLength));
            receivedLength = xhr.responseText.length;
            streamFinished = true;
            animateReply();
          } else {
            botMessage.parentNode.removeChild(botMessage);
            var errorText = 'Gagal koneksi (' + xhr.status + ').';
            try {
              var errorData = JSON.parse(xhr.responseText);
              if (errorData.reply) errorText = errorData.reply;
            } catch (e) {}
            box.innerHTML += '<div class="msg error"><b>System:</b> ' + escapeHtml(errorText) + '</div>';
          }
          box.scrollTop = box.scrollHeight;
        }
      };

      xhr.send(JSON.stringify({ prompt: text }));

      function readStream(chunk) {
        sseBuffer += chunk.replace(/\r/g, '');
        var end;
        while ((end = sseBuffer.indexOf('\n\n')) !== -1) {
          var eventText = sseBuffer.substring(0, end);
          sseBuffer = sseBuffer.substring(end + 2);
          var lines = eventText.split('\n');
          var payload = '';
          for (var i = 0; i < lines.length; i++) {
            if (lines[i].indexOf('data:') === 0) payload += lines[i].substring(5).trim();
          }
          if (!payload || payload === '[DONE]') continue;
          try {
            var eventData = JSON.parse(payload);
            var part = '';
            if (eventData.candidates && eventData.candidates[0] &&
                eventData.candidates[0].content && eventData.candidates[0].content.parts &&
                eventData.candidates[0].content.parts[0]) {
              part = eventData.candidates[0].content.parts[0].text || '';
            }
            if (part) {
              replyText += part;
              animateReply();
            }
          } catch (e) {}
        }
      }

      // Fallback typewriter: bila proxy menggabungkan seluruh SSE menjadi satu
      // blok, balasan tetap terasa hidup. Hanya dua karakter tiap 30 ms agar
      // hemat CPU pada browser BlackBerry lama.
      function animateReply() {
        if (typingTimer) return;
        typingTimer = window.setInterval(function() {
          if (shownText.length < replyText.length) {
            shownText += replyText.substr(shownText.length, 2);
            botMessage.innerHTML = '<b>Gemini:</b> ' + renderMarkdown(shownText) + '<span class="cursor">&#9612;</span>';
            box.scrollTop = box.scrollHeight;
            return;
          }
          if (streamFinished) {
            window.clearInterval(typingTimer);
            typingTimer = null;
            botMessage.innerHTML = '<b>Gemini:</b> ' + renderMarkdown(shownText || 'Tidak ada respons dari model.');
          }
        }, 30);
      }
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\n/g, "<br>");
    }

    // Markdown kecil agar ringan untuk browser lama. Teks selalu di-escape
    // dulu, jadi format tidak dapat menyisipkan HTML atau script.
    function renderMarkdown(str) {
      var safe = String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      safe = safe.replace(/`([^`\n]+)`/g, '<code>$1</code>');
      safe = safe.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
      safe = safe.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');

      var lines = safe.split('\n');
      var html = [];
      var inList = false;
      for (var i = 0; i < lines.length; i++) {
        var line = lines[i];
        var heading = line.match(/^(#{1,3})\s+(.+)$/);
        var item = line.match(/^[-*]\s+(.+)$/);
        if (item) {
          if (!inList) { html.push('<ul>'); inList = true; }
          html.push('<li>' + item[1] + '</li>');
          continue;
        }
        if (inList) { html.push('</ul>'); inList = false; }
        if (heading) {
          var level = heading[1].length;
          html.push('<h' + level + '>' + heading[2] + '</h' + level + '>');
        } else {
          html.push(line || '<br>');
        }
      }
      if (inList) html.push('</ul>');
      return html.join('<br>');
    }

    document.getElementById('input-text').addEventListener('keydown', function(e) {
      if (e.keyCode === 13) {
        sendMsg();
      }
    });
  </script>
</body>
</html>
